<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Redirecting to GTA Online — Nanoboost</title>
    <meta name="robots" content="noindex,follow" />
    <!-- vercel.json issues a permanent 301 to game.html?game=gta5 for
         search-engine link equity. The meta-refresh + JS replace below
         keeps the page useful for any browser that hits this URL
         directly without going through Vercel's edge. -->
    <meta http-equiv="refresh" content="0;url=./game.html?game=gta5" />
    <link rel="canonical" href="https://nanoboost.io/pages/game.html?game=gta5" />
    <script>
      location.replace("./game.html?game=gta5");
    </script>
  </head>
  <body>
    <p>
      Redirecting to
      <a href="./game.html?game=gta5">GTA Online services</a>…
    </p>
  </body>
</html>
