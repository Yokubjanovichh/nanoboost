# Railway/Nixpacks build + static serve config (DevOps infra).
# install phase (npm ci) runs automatically via the Node provider.
# build phase: build the site, then install `serve` globally while the
# build network is available (avoids an unreliable npx download at
# container start). start: serve the static multi-page output.
[phases.build]
cmds = ["npm run build", "npm install -g serve"]

[start]
cmd = "serve dist -l tcp://0.0.0.0:$PORT"
