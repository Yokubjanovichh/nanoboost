# Railway/Nixpacks build + static serve config (DevOps infra).
# Explicitly declare the Node provider and pin caddy into the setup
# nixPkgs so the binary exists at runtime (a globally npm-installed
# server lives only in the build image and is missing at start).
providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs", "caddy"]

[phases.build]
cmds = ["npm run build"]

# Caddy file-server: serves dist/ on $PORT bound to all interfaces.
# Multi-page site uses full .html paths, so no SPA rewrite is needed.
[start]
cmd = "caddy file-server --root dist --listen :$PORT"
