# Railway/Nixpacks build + static serve config (DevOps infra).
# Node provider auto-runs `npm ci` + `npm run build` (build.js -> dist/).
# Serve the pre-rendered multi-page output with `serve` (Node-native,
# clean-URL aware). Caddy was avoided here because the Node base image
# does not ship the caddy binary at runtime.
[start]
cmd = "npx -y serve dist -l $PORT"
